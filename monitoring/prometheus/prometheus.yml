global:
  scrape_interval: 15s

scrape_configs:

  - job_name: "enrichment-worker"
    static_configs:
      - targets: ["localhost:9093"]

  - job_name: "redis"
    static_configs:
      - targets: ["localhost:9121"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
